<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splice music lab</title>
<style>
@font-face { font-family: 'Chakra Petch'; font-weight: 600; font-display: swap; src: url(../fonts/chakra-petch-latin-600.woff2) format('woff2'); }
@font-face { font-family: 'Chakra Petch'; font-weight: 400; font-display: swap; src: url(../fonts/chakra-petch-latin-400.woff2) format('woff2'); }
:root { --acc: #20e8ff; --bg: #05090b; --fg: #d6e1e6; --dim: #7d8b92; --line: #ffffff1c; color-scheme: dark;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; background: var(--bg); color: var(--fg); transition: background .6s; }
body { font: 400 15px/1.45 'Chakra Petch', ui-monospace, 'SF Mono', Menlo, monospace; min-height: 100vh; }
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 18px; }
h1 { margin: 0; font-size: 13px; font-weight: 400; color: var(--dim); }
#host { margin: 2px 0 0; font-size: clamp(20px, 6vw, 28px); font-weight: 600; line-height: 1.15; color: var(--acc);
  text-shadow: 0 0 18px color-mix(in srgb, var(--acc) 45%, transparent); overflow-wrap: anywhere; }
#meta { margin: 6px 0 0; color: var(--dim); font-size: 14px; }
#meta b { color: var(--fg); font-weight: 600; }
.row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
button, select, input { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 2px; min-height: 44px; }
button { padding: 0 14px; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
#step { display: flex; }
#step button { width: 44px; padding: 0; font-size: 20px; }
#lvl { width: 72px; text-align: center; border-left: 0; border-right: 0; }
select { padding: 0 10px; flex: 1; min-width: 140px; }
#play { flex: 1 1 100%; min-height: 56px; font-weight: 600; font-size: 17px; border-color: var(--acc); color: var(--acc); }
#play[aria-pressed="true"] { background: var(--acc); color: var(--bg); }
.seg { display: flex; flex: 1 1 100%; }
.seg button { flex: 1; border-radius: 0; }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { border-color: currentColor; }
#calm[aria-pressed="true"] { color: var(--acc); }
#rise[aria-pressed="true"] { color: #ffb020; }
#crit[aria-pressed="true"] { color: #ff2a4a; }
.ends { flex: 1 1 100%; display: flex; gap: 10px; }
.ends button { flex: 1; }
#grid { display: grid; grid-template-columns: 44px repeat(16, 1fr); gap: 3px; align-items: center; }
#grid .lane { font-size: 12px; color: var(--dim); }
#grid .lane.off { opacity: .35; }
#grid i { aspect-ratio: 1; background: #ffffff0a; border-radius: 1px; }
#grid i.on { background: color-mix(in srgb, var(--acc) calc(var(--v) * 70%), #ffffff14); }
#grid i.off.on { background: #ffffff22; }
#grid i.now { box-shadow: 0 0 0 1px var(--acc); }
#grid i.now.on:not(.off) { background: var(--acc); box-shadow: 0 0 10px var(--acc); }
#where { margin: 0; font-size: 14px; color: var(--dim); min-height: 1.45em; }
#where b { color: var(--fg); font-weight: 600; }
#arr { display: flex; gap: 3px; }
#arr span { flex: 1; height: 4px; background: var(--line); }
#arr span.now { background: var(--acc); }
p.note { margin: 0; font-size: 13px; color: var(--dim); max-width: 60ch; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Splice music lab</h1>
    <p id="host"></p>
    <p id="meta"></p>
  </header>
  <div class="row">
    <div id="step"><button id="dn" aria-label="Previous level">&minus;</button><input id="lvl" inputmode="numeric" aria-label="Level" value="1"><button id="up" aria-label="Next level">+</button></div>
    <select id="ice" aria-label="ICE"></select>
    <button id="play" aria-pressed="false">Play level 1</button>
    <div class="seg" role="group" aria-label="Trace">
      <button id="calm" aria-pressed="true">Calm</button><button id="rise" aria-pressed="false">Trace rising</button><button id="crit" aria-pressed="false">Trace critical</button>
    </div>
    <div class="ends"><button id="win">Root access</button><button id="lose">Flatline</button></div>
  </div>
  <section aria-label="Patterns">
    <p id="where">Press play to hear this level’s track.</p>
    <div id="arr"></div>
    <div id="grid"></div>
  </section>
  <p class="note">Every level gets its own track from its seed: tempo from the security tier, key from the palette, scale from the host. ICE changes the arp and the effects. The same level always sounds the same.</p>
</main>
<script type="module">
import { songFor, STEPS, BARS, ARRANGE } from '../src/music.js';
import * as SND from '../src/audio.js';
import { hostFor, iceFor, themeFor, secFor, ICE } from '../src/hosts.js';

const $ = s => document.querySelector(s), NOTE = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
const SEC = ['Open', 'Guarded', 'Hardened', 'Fortified'], ICE_NAME = t => t[0].toUpperCase() + t.slice(1);
const LANES = [['kick', 'Kick'], ['hat', 'Hats'], ['open', 'Open'], ['clap', 'Clap'], ['bass', 'Bass'], ['arp', 'Arp'], ['perc', 'Glitch']];
let level = 1, song = null, playing = false, mood = 0;

for (const [v, n] of [['auto', 'Level’s own ICE'], ['none', 'No ICE'], ...Object.keys(ICE).map(k => [k, `${ICE_NAME(k)} (${ICE[k]})`])]) $('#ice').add(new Option(n, v));
const iceOf = () => { const v = $('#ice').value; return v === 'auto' ? iceFor(level) : v === 'none' ? null : v; };

function show() {
  const th = themeFor(level); document.documentElement.style.setProperty('--acc', th.a); document.documentElement.style.setProperty('--bg', th.bg);
  song = songFor(level, iceOf()); const ice = song.ice;
  $('#lvl').value = level; $('#host').textContent = hostFor(level).label;
  $('#meta').innerHTML = `<b>${song.bpm}</b> bpm in <b>${NOTE[song.root % 12]} ${song.scale}</b>, ${SEC[secFor(level)].toLowerCase()}${ice ? `, ICE <b>${ICE_NAME(ice)}</b>` : ', no ICE'}`;
  $('#play').textContent = playing ? 'Stop' : `Play level ${level}`;
  $('#arr').replaceChildren(...ARRANGE.map(() => document.createElement('span')));
  const cells = [];
  for (const [k, n] of LANES) {
    const l = document.createElement('span'); l.className = 'lane'; l.textContent = n; l.dataset.k = k; cells.push(l);
    const row = k === 'arp' ? song.gate.map(Number) : k === 'bass' ? song.bass.map(b => b === null ? 0 : b ? .7 : 1) : song[k].map(Number);
    row.forEach((v, i) => { const c = document.createElement('i'); c.dataset.k = k; c.dataset.i = i; if (v) { c.className = 'on'; c.style.setProperty('--v', v); } cells.push(c); });
  }
  $('#grid').replaceChildren(...cells);
  if (playing) { SND.playSong(song); SND.setMood(mood); }
}
function setLevel(n) { level = Math.max(1, Math.min(9999, n | 0 || 1)); show(); }
$('#dn').onclick = () => setLevel(level - 1); $('#up').onclick = () => setLevel(level + 1);
$('#lvl').onchange = () => setLevel(+$('#lvl').value); $('#ice').onchange = show;
$('#play').onclick = () => {
  SND.unlock(); playing = !playing; $('#play').setAttribute('aria-pressed', playing);
  if (playing) { SND.playSong(song); SND.setMood(mood); } else SND.stopSong();
  $('#play').textContent = playing ? 'Stop' : `Play level ${level}`;
};
const moods = ['calm', 'rise', 'crit'];
moods.forEach((id, m) => $('#' + id).onclick = () => { mood = m; SND.setMood(m); moods.forEach((x, i) => $('#' + x).setAttribute('aria-pressed', i === m)); });
$('#win').onclick = () => { SND.winSong(); };
$('#lose').onclick = () => { SND.loseSong(); };
document.addEventListener('visibilitychange', () => SND.setHidden(document.hidden));

show();
let last = -1;
(function frame() {
  const p = SND.position();
  if (p.step !== last) {
    last = p.step ?? -1;
    const live = p.id === song.id && p.state === 'play', s = live ? p.step % STEPS : -1, X = live ? p.section : null;
    for (const c of $('#grid').children) {
      const off = X && !X[c.dataset.k]; c.classList.toggle('off', !!off);
      if (c.tagName === 'I') c.classList.toggle('now', +c.dataset.i === s);
    }
    const n = live ? Math.floor(p.step / STEPS / BARS) : -1, idx = n < 0 ? -1 : n < ARRANGE.length ? n : song.loop + (n - ARRANGE.length) % (ARRANGE.length - song.loop);
    [...$('#arr').children].forEach((e, i) => e.classList.toggle('now', i === idx));
    $('#where').innerHTML = live ? `Section <b>${X.name}</b>, bar ${Math.floor(p.step / STEPS) % BARS + 1} of ${BARS}` : p.state === 'win' ? 'Root access' : playing ? '&nbsp;' : 'Press play to hear this level’s track.';
    if (playing && p.state === 'idle') { playing = false; $('#play').setAttribute('aria-pressed', false); $('#play').textContent = `Play level ${level}`; }   // ended: a win or a flatline
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
