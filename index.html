<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07080b">
<title>Splice</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Splice">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/chakra-petch-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script type="module" src="src/ui.js"></script>
</head>
<body>
<main id="deck">
<header id="hud"><div class="l"><small><span id="jack"></span><span id="ice"></span></small><b id="host"></b></div><div class="r"><small id="lvl"></small><b id="score"></b></div><button id="menuBtn"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h11M3 18h15"/></svg></button></header>
<canvas id="strip"></canvas>
<div id="frame"><canvas id="board"></canvas><button id="deckBtn"></button><div id="drawer" hidden></div></div>
<div id="bar"><small id="pk"></small><b id="shots"></b><span id="segs"></span></div>
<div id="log"></div>
</main>
<p id="wip"></p>
<div id="alert" hidden></div>
<div id="turn"><p id="turnText"></p></div>
<div id="load" hidden><div class="card"><h2 id="loadT"></h2><p id="loadM"></p></div></div>
<div id="sheet" hidden><div class="card"><h2 id="sheetT"></h2><p id="sheetP" hidden></p><button id="sheetB"></button><button id="sheetO" hidden></button><button id="sheetC" hidden></button></div></div>
<div id="menu" hidden>
<nav id="tabs"><button data-tab="run"></button><button data-tab="shop"></button><button data-tab="info"></button></nav>
<section data-tab="run">
<div class="row"><span id="curL"></span><b id="curN"></b></div>
<div class="row"><span id="bestL"></span><b id="bestN"></b></div>
<button id="mRestart"></button>
<button id="mBack"></button>
<button id="mOver"></button>
<p id="pickL"></p>
<div id="step"><button id="lvlDn"></button><input id="lvlIn" type="text" inputmode="numeric" autocomplete="off"><button id="lvlUp"></button></div>
<p id="pickHost"></p>
<button id="mPlay"></button>
<button id="mReset"></button>
</section>
<section data-tab="shop" hidden>
<small id="balL"></small>
<h2 id="balN"></h2>
<div id="shopList"></div>
</section>
<section data-tab="info" hidden>
<h2 id="iName"></h2>
<p id="iText"></p>
<p id="iHow"></p>
<button id="iShare"></button>
<a id="iSrc" class="btn" href="https://github.com/thomaslazar/splice" target="_blank" rel="noopener"></a>
<p id="iUrl" hidden></p>
<small id="iLic"></small>
<small id="iCred"></small>
<label class="pick"><span id="iLang"></span><select id="iSel"></select></label>
</section>
<button id="mKeep" class="primary"></button>
</div>
<div id="demo" hidden><div class="card"><h2 id="demoN"></h2><span id="demoI"></span><canvas id="demoC"></canvas><p id="demoD"></p><button id="demoX"></button></div></div>
<div id="scan"></div>
</body>
</html>
